name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  server:
    name: Server — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  clients:
    name: Client — ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [userclient, adminclient]
    defaults:
      run:
        working-directory: client/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Build against .env.production, proving the committed env files are complete.
      - run: npm run build
